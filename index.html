<!DOCTYPE html>

</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased">

      <main class="flex-1 p-4 md:p-6 pb-24 md:pb-8 space-y-5 max-w-6xl w-full mx-auto">

  <script>
    const METRIC_GROUPS = [
      {
        label: '환율 · 지수',
        items: [
          { key: 'usdkrw', label: '환율', full: '달러/원 환율 (원)', color: '#38bdf8', dashDigits: 1, unit: '원' },
          { key: 'kospi', label: '코스피', full: '코스피 지수 (pt)', color: '#f43f5e', dashDigits: 1, unit: '' },
          { key: 'nasdaq', label: '나스닥', full: '나스닥 지수 (pt)', color: '#818cf8', dashDigits: 1, unit: '' },
          { key: 'sp500', label: 'S&P500', full: 'S&P 500 지수 (pt)', color: '#60a5fa', dashDigits: 1, unit: '' },
        ]
      },
      {
        label: '원자재 · 자산',
        items: [
          { key: 'wti', label: 'WTI유가', full: 'WTI 유가 ($/배럴)', color: '#f59e0b', dashDigits: 2, unit: '$' },
          { key: 'premium_gasoline', label: '고급유', full: '고급 휘발유 (원/L)', color: '#fb7185', dashDigits: 1, unit: '원' },
          { key: 'gasoline', label: '일반유', full: '일반 휘발유 (원/L)', color: '#10b981', dashDigits: 1, unit: '원' },
          { key: 'gold_kr', label: '국내금', full: '국내 금 (원/1g)', color: '#eab308', dashDigits: 1, unit: '원' },
          { key: 'btc', label: '비트코인', full: '비트코인 (원)', color: '#f97316', dashDigits: 0, unit: '원' },
        ]
      },
      {
        label: '빅테크 포트폴리오',
        items: [
          { key: 'NVDA', label: '엔비디아', full: '엔비디아 ($)', color: '#22c55e' },
          { key: 'AAPL', label: '애플', full: '애플 ($)', color: '#a855f7' },
          { key: 'TSLA', label: '테슬라', full: '테슬라 ($)', color: '#e11d48' },
          { key: '005930.KS', label: '삼성전자', full: '삼성전자 (원)', color: '#3b82f6' },
          { key: 'MSFT', label: 'MSFT', full: '마이크로소프트 ($)', color: '#06b6d4' },
          { key: 'SPCX', label: 'SPCX', full: '스페이스X(SPCX) ($)', color: '#c084fc' },
          { key: 'BOTZ', label: 'BOTZ', full: '로보틱스&AI ETF (BOTZ) ($)', color: '#2dd4bf' },
        ]
      },
    ];

    const DASH_METRIC_KEYS = ['usdkrw', 'kospi', 'nasdaq', 'sp500', 'wti', 'btc', 'gold_kr', 'gasoline'];
    const VIEW_TITLES = {
      dashboard: '대시보드',
      briefing: '브리핑',
      reports: '리포트',
    };

    const RANGE_OPTIONS = [
      { key: '1w', label: '1주', days: 7 },
      { key: '1m', label: '1개월', days: 30 },
      { key: '3m', label: '3개월', days: 90 },
      { key: '6m', label: '6개월', days: 180 },
      { key: 'all', label: '전체', days: null },
    ];

    const BRIEFINGS_URL = './briefings.json';
    const LEGACY_BRIEFINGS_URL = './history.json';
    const REPORTS_URL = './reports.json';

    let rawData = [];
    let reportsData = [];
    let chartInstance = null;
    let currentKey = 'usdkrw';
    let currentLabel = '달러/원 환율 (원)';
    let currentColor = '#38bdf8';
    let selectedItemIndex = -1;
    let currentRangeKey = '1m';
    let currentView = 'dashboard';
    let briefingChartReady = false;
    let reportsTab = 'weekly'; // weekly | monthly
    let reportsFilterBound = false;

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));
    }

    function findMetricMeta(key) {
      for (const g of METRIC_GROUPS) {
        const hit = g.items.find(i => i.key === key);
        if (hit) return hit;
      }
      return null;
    }

    function pctClass(pct) {
      if (pct == null || Number.isNaN(Number(pct))) return 'text-slate-400';
      const v = Number(pct);
      if (Math.abs(v) < 0.005) return 'text-slate-400';
      return v > 0 ? 'text-emerald-400' : 'text-rose-400';
    }

    function pctArrow(pct) {
      if (pct == null || Number.isNaN(Number(pct))) return { sym: '·', label: '데이터 없음' };
      const v = Number(pct);
      if (Math.abs(v) < 0.005) return { sym: '▸', label: '동일' };
      if (v > 0) return { sym: '▲', label: '상승' };
      return { sym: '▼', label: '하락' };
    }

    function formatPct(pct) {
      if (pct == null || Number.isNaN(Number(pct))) return '—';
      const v = Number(pct);
      if (Math.abs(v) < 0.005) return '0.00%';
      return `${v > 0 ? '+' : ''}${v.toFixed(2)}%`;
    }

    /** 대시보드용: 화살표 + 등락률 HTML */
    function formatPctWithArrowHtml(pct) {
      const arrow = pctArrow(pct);
      const cls = pctClass(pct);
      return `<span class="inline-flex items-center gap-1 ${cls}" title="${escapeHtml(arrow.label)}">
        <span class="text-[11px] leading-none" aria-hidden="true">${arrow.sym}</span>
        <span class="num">${escapeHtml(formatPct(pct))}</span>
        <span class="sr-only">${escapeHtml(arrow.label)}</span>
      </span>`;
    }

    function formatValue(val, meta) {
      if (val == null || Number.isNaN(Number(val))) return '—';
      const n = Number(val);
      const digits = meta?.dashDigits ?? 2;
      if (meta?.key === 'btc') return `${(n / 100000000).toFixed(2)}억`;
      const unit = meta?.unit || '';
      const body = n.toLocaleString('ko-KR', {
        minimumFractionDigits: digits,
        maximumFractionDigits: digits,
      });
      if (unit === '$') return `$${body}`;
      return unit ? `${body}${unit}` : body;
    }

    function setView(view) {
      if (!VIEW_TITLES[view]) view = 'dashboard';
      currentView = view;
      Object.keys(VIEW_TITLES).forEach(v => {
        const el = document.getElementById('view-' + v);
        if (!el) return;
        el.classList.toggle('view-hidden', v !== view);
      });
      document.querySelectorAll('.nav-link').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-view') === view);
      });
      const title = document.getElementById('pageTitle');
      if (title) title.textContent = VIEW_TITLES[view];
      if (location.hash.replace('#', '') !== view) {
        history.replaceState(null, '', '#' + view);
      }
      if (view === 'briefing' && !briefingChartReady && rawData.length) {
        displayDetail(rawData[selectedItemIndex] || rawData[rawData.length - 1]);
        renderRangeSelector();
        renderChart();
        briefingChartReady = true;
      } else if (view === 'briefing' && chartInstance) {
        // 숨겨진 차트는 크기 재계산이 필요할 수 있음
        requestAnimationFrame(() => chartInstance && chartInstance.resize());
      }
    }

    function bindNav() {
      document.querySelectorAll('[data-view]').forEach(btn => {
        btn.addEventListener('click', () => setView(btn.getAttribute('data-view')));
      });
      document.querySelectorAll('[data-go]').forEach(btn => {
        btn.addEventListener('click', () => setView(btn.getAttribute('data-go')));
      });
    }

    function reportCardHtml(r) {
      const kind = r.type === 'monthly' ? '월간' : '주간';
      const badge = r.type === 'monthly'
        ? 'bg-violet-500/15 text-violet-300 border-violet-500/30'
        : 'bg-emerald-500/15 text-emerald-300 border-emerald-500/30';
      const gen = r.generatedAt ? formatKstDateTime(r.generatedAt) : '';
      const title = r.headline || r.title || r.id || '리포트';
      const sub = [r.id, r.dateRange].filter(Boolean).join(' · ');
      // JSON을 data 속성에 넣지 않고 path/title만 — 클릭 시 reportsData에서 조회
      return `
        <button type="button"
           data-report-path="${escapeHtml(r.path)}"
           data-report-title="${escapeHtml(title)}"
           data-report-sub="${escapeHtml(sub)}"
           class="report-open w-full text-left rounded-xl border border-slate-800 bg-slate-900 px-4 py-3.5 hover:border-sky-500/40 hover:bg-slate-900/80 transition">
          <div class="flex items-center gap-2 mb-1.5 flex-wrap">
            <span class="text-[11px] px-1.5 py-0.5 rounded border ${badge}">${kind}</span>
            <span class="text-xs text-slate-400 num font-medium">${escapeHtml(r.id || '')}</span>
            <span class="text-xs text-slate-600">·</span>
            <span class="text-xs text-slate-500 num">${escapeHtml(r.dateRange || '')}</span>
          </div>
          <div class="text-sm text-slate-100 leading-snug">${escapeHtml(title)}</div>
          ${gen ? `<div class="text-[11px] text-slate-600 mt-2 num">생성 ${escapeHtml(gen)}</div>` : ''}
        </button>`;
    }

    function openReportModal(path, title, sub) {
      const modal = document.getElementById('reportModal');
      const frame = document.getElementById('reportModalFrame');
      const titleEl = document.getElementById('reportModalTitle');
      const subEl = document.getElementById('reportModalSub');
      const openTab = document.getElementById('reportModalOpenTab');
      if (!modal || !frame) return;
      titleEl.textContent = title || '리포트';
      subEl.textContent = sub || '';
      openTab.href = path;
      frame.src = path;
      modal.setAttribute('aria-hidden', 'false');
      document.body.classList.add('modal-open');
      document.getElementById('reportModalClose')?.focus();
    }

    function closeReportModal() {
      const modal = document.getElementById('reportModal');
      const frame = document.getElementById('reportModalFrame');
      if (!modal) return;
      modal.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('modal-open');
      if (frame) frame.src = 'about:blank';
    }

    function bindReportOpeners(root) {
      (root || document).querySelectorAll('.report-open').forEach(btn => {
        if (btn.dataset.bound === '1') return;
        btn.dataset.bound = '1';
        btn.addEventListener('click', () => {
          openReportModal(
            btn.getAttribute('data-report-path'),
            btn.getAttribute('data-report-title'),
            btn.getAttribute('data-report-sub')
          );
        });
      });
    }

    function bindReportModal() {
      document.getElementById('reportModalClose')?.addEventListener('click', closeReportModal);
      document.getElementById('reportModalBackdrop')?.addEventListener('click', closeReportModal);
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && document.getElementById('reportModal')?.getAttribute('aria-hidden') === 'false') {
          closeReportModal();
        }
      });
    }

    /** dateRange "YYYY-MM-DD ~ YYYY-MM-DD" 또는 generatedAt / id에서 기간 추출 */
    function reportPeriod(r) {
      const range = String(r.dateRange || '');
      const m = range.match(/(\d{4}-\d{2}-\d{2})\s*[~\-–]\s*(\d{4}-\d{2}-\d{2})/);
      if (m) return { start: m[1], end: m[2] };
      if (r.type === 'monthly' && /^\d{4}-\d{2}/.test(String(r.id || ''))) {
        const ym = String(r.id).slice(0, 7);
        return { start: `${ym}-01`, end: `${ym}-31` };
      }
      if (r.generatedAt) {
        const d = String(r.generatedAt).slice(0, 10);
        if (/^\d{4}-\d{2}-\d{2}$/.test(d)) return { start: d, end: d };
      }
      return { start: null, end: null };
    }

    function reportOverlapsFilter(r, from, to) {
      if (!from && !to) return true;
      const { start, end } = reportPeriod(r);
      const s = start || end;
      const e = end || start;
      if (!s && !e) return true;
      if (from && e && e < from) return false;
      if (to && s && s > to) return false;
      return true;
    }

    function reportMatchesSearch(r, q) {
      if (!q) return true;
      const hay = [r.id, r.title, r.headline, r.dateRange, r.type]
        .map(x => String(x || '').toLowerCase())
        .join(' ');
      return hay.includes(q);
    }

    function getFilteredReports() {
      const q = (document.getElementById('reportsSearch')?.value || '').trim().toLowerCase();
      const from = document.getElementById('reportsFrom')?.value || '';
      const to = document.getElementById('reportsTo')?.value || '';
      return (reportsData || []).filter(r => {
        if (r.type !== reportsTab) return false;
        if (!reportMatchesSearch(r, q)) return false;
        if (!reportOverlapsFilter(r, from, to)) return false;
        return true;
      });
    }

    function setReportsTab(tab) {
      reportsTab = tab === 'monthly' ? 'monthly' : 'weekly';
      document.querySelectorAll('.report-tab').forEach(btn => {
        const active = btn.getAttribute('data-report-tab') === reportsTab;
        btn.className = 'report-tab px-3 py-1.5 rounded-md text-xs font-medium transition';
        if (active && reportsTab === 'weekly') {
          btn.classList.add('bg-emerald-600', 'text-white');
        } else if (active && reportsTab === 'monthly') {
          btn.classList.add('bg-violet-600', 'text-white');
        } else {
          btn.classList.add('text-slate-400', 'hover:text-slate-200');
        }
      });
      renderReportsList();
    }

    function renderReportsList() {
      const list = document.getElementById('reportsList');
      const empty = document.getElementById('reportsEmpty');
      const count = document.getElementById('reportsCount');
      const weeklyN = (reportsData || []).filter(r => r.type === 'weekly').length;
      const monthlyN = (reportsData || []).filter(r => r.type === 'monthly').length;
      const wEl = document.getElementById('reportsWeeklyCount');
      const mEl = document.getElementById('reportsMonthlyCount');
      if (wEl) wEl.textContent = String(weeklyN);
      if (mEl) mEl.textContent = String(monthlyN);

      if (!Array.isArray(reportsData) || reportsData.length === 0) {
        list.innerHTML = '';
        count.textContent = '0건';
        empty.classList.remove('hidden');
        empty.textContent = '등록된 리포트가 없습니다.';
        return;
      }

      const filtered = getFilteredReports();
      const kindLabel = reportsTab === 'monthly' ? '월간' : '주간';
      count.textContent = `${filtered.length}건 표시`;

      if (filtered.length === 0) {
        list.innerHTML = '';
        empty.classList.remove('hidden');
        const hasType = (reportsData || []).some(r => r.type === reportsTab);
        empty.textContent = hasType
          ? '조건에 맞는 리포트가 없습니다.'
          : `아직 ${kindLabel} 리포트가 없습니다.`;
        return;
      }

      empty.classList.add('hidden');
      list.innerHTML = filtered.map(reportCardHtml).join('');
      bindReportOpeners(list);
    }

    function bindReportsFilters() {
      if (reportsFilterBound) return;
      reportsFilterBound = true;
      document.querySelectorAll('[data-report-tab]').forEach(btn => {
        btn.addEventListener('click', () => setReportsTab(btn.getAttribute('data-report-tab')));
      });
      const search = document.getElementById('reportsSearch');
      const from = document.getElementById('reportsFrom');
      const to = document.getElementById('reportsTo');
      const reset = document.getElementById('reportsFilterReset');
      let debounce = null;
      const rerender = () => renderReportsList();
      search?.addEventListener('input', () => {
        clearTimeout(debounce);
        debounce = setTimeout(rerender, 150);
      });
      from?.addEventListener('change', rerender);
      to?.addEventListener('change', rerender);
      reset?.addEventListener('click', () => {
        if (search) search.value = '';
        if (from) from.value = '';
        if (to) to.value = '';
        rerender();
      });
    }

    async function loadReports() {
      const empty = document.getElementById('reportsEmpty');
      bindReportsFilters();
      try {
        const res = await fetch(REPORTS_URL + '?t=' + Date.now());
        if (!res.ok) throw new Error('reports.json ' + res.status);
        reportsData = await res.json();
        if (!Array.isArray(reportsData)) reportsData = [];

        setReportsTab(reportsTab);

        // 대시보드 미리보기 (최대 2건, 종류 무관 최신순 가정)
        const previewWrap = document.getElementById('dashReportsPreview');
        const previewList = document.getElementById('dashReportsList');
        if (reportsData.length > 0) {
          previewList.innerHTML = reportsData.slice(0, 2).map(reportCardHtml).join('');
          previewWrap.classList.remove('hidden');
          bindReportOpeners(previewList);
        }
      } catch (e) {
        console.warn('리포트 목록 로드 실패:', e);
        reportsData = [];
        renderReportsList();
        empty.classList.remove('hidden');
        empty.textContent = '리포트 목록을 불러오지 못했습니다.';
      }
    }

    function renderDashboard(latest) {
      const overallEl = document.getElementById('dashOverall');
      const dateEl = document.getElementById('dashBriefingDate');
      const metricGrid = document.getElementById('dashMetricGrid');
      const portGrid = document.getElementById('dashPortfolioGrid');

      if (!latest) {
        overallEl.textContent = '저장된 브리핑이 없습니다.';
        metricGrid.innerHTML = '';
        portGrid.innerHTML = '';
        return;
      }

      const overall = (latest.reasons && latest.reasons.overall) || latest.reason || '요약 없음';
      overallEl.textContent = overall;
      dateEl.textContent = latest.date || '—';

      metricGrid.innerHTML = DASH_METRIC_KEYS.map(key => {
        const meta = findMetricMeta(key) || { key, label: key, dashDigits: 2 };
        const val = extractValue(latest, key);
        const pct = latest.metrics ? latest.metrics[`${key}_pct`] : null;
        const arrow = pctArrow(pct);
        return `
          <button type="button"
                  class="text-left rounded-xl border border-slate-800 bg-slate-900/80 px-3.5 py-3 hover:border-sky-500/40 transition"
                  onclick="openBriefingMetric('${escapeHtml(key)}')">
            <div class="flex items-center justify-between gap-2 mb-1">
              <div class="text-[11px] text-slate-500">${escapeHtml(meta.label)}</div>
              <div class="text-sm font-semibold leading-none ${pctClass(pct)}" aria-label="${escapeHtml(arrow.label)}" title="${escapeHtml(arrow.label)}">${arrow.sym}</div>
            </div>
            <div class="text-base font-semibold text-slate-100 num">${escapeHtml(formatValue(val, meta))}</div>
            <div class="text-xs mt-1">${formatPctWithArrowHtml(pct)}</div>
          </button>`;
      }).join('');

      const portfolio = latest.portfolio || {};
      const portItems = METRIC_GROUPS.find(g => g.label.includes('포트폴리오'))?.items || [];
      portGrid.innerHTML = portItems.map(meta => {
        const info = portfolio[meta.key] || portfolio[meta.key.replace('.O', '')] || {};
        const price = info.price;
        const pct = info.change_rate;
        const arrow = pctArrow(pct);
        const isKr = meta.key.endsWith('.KS');
        const valueStr = price == null ? '—' : (
          isKr
            ? `${Number(price).toLocaleString('ko-KR')}원`
            : `$${Number(price).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`
        );
        return `
          <button type="button"
                  class="text-left rounded-xl border border-slate-800 bg-slate-900/80 px-3.5 py-3 hover:border-sky-500/40 transition"
                  onclick="openBriefingMetric('${escapeHtml(meta.key)}')">
            <div class="flex items-center justify-between gap-2 mb-1">
              <div class="text-[11px] text-slate-500">${escapeHtml(meta.label)}</div>
              <div class="text-sm font-semibold leading-none ${pctClass(pct)}" aria-label="${escapeHtml(arrow.label)}" title="${escapeHtml(arrow.label)}">${arrow.sym}</div>
            </div>
            <div class="text-sm font-semibold text-slate-100 num">${escapeHtml(valueStr)}</div>
            <div class="text-xs mt-1">${formatPctWithArrowHtml(pct)}</div>
          </button>`;
      }).join('');
    }

    function openBriefingMetric(key) {
      const meta = findMetricMeta(key);
      if (!meta) {
        setView('briefing');
        return;
      }
      setView('briefing');
      // metricNav 버튼 동기화
      const btn = document.querySelector(`#metricNav .btn[data-key="${CSS.escape(key)}"]`);
      changeMetric(meta.key, meta.full, meta.color, btn);
    }

    function renderRangeSelector() {
      const el = document.getElementById('rangeSelector');
      el.innerHTML = RANGE_OPTIONS.map(r => `
        <button
          data-range="${r.key}"
          onclick="changeRange('${r.key}', this)"
          class="range-btn px-2.5 py-1 rounded-md text-xs font-medium transition
            ${r.key === currentRangeKey ? 'bg-slate-700 text-white' : 'bg-slate-800/60 text-slate-400 hover:bg-slate-700/60'}"
        >${r.label}</button>
      `).join('');
    }

    function changeRange(key, btnEl) {
      currentRangeKey = key;
      document.querySelectorAll('.range-btn').forEach(b => {
        b.classList.remove('bg-slate-700', 'text-white');
        b.classList.add('bg-slate-800/60', 'text-slate-400');
      });
      if (btnEl) {
        btnEl.classList.remove('bg-slate-800/60', 'text-slate-400');
        btnEl.classList.add('bg-slate-700', 'text-white');
      }
      renderChart();
    }

    function getFilteredData() {
      const opt = RANGE_OPTIONS.find(r => r.key === currentRangeKey);
      if (!opt || opt.days === null) return rawData;
      return rawData.slice(-opt.days);
    }

    function renderNav() {
      const nav = document.getElementById('metricNav');
      nav.innerHTML = METRIC_GROUPS.map(group => `
        <div class="flex flex-col sm:flex-row sm:items-center gap-2">
          <span class="text-xs text-slate-500 w-28 shrink-0 font-medium">${group.label}</span>
          <div class="flex flex-wrap gap-1.5">
            ${group.items.map(m => `
              <button
                data-key="${m.key}"
                onclick="changeMetric('${m.key}', '${m.full}', '${m.color}', this)"
                class="btn px-3 py-1.5 rounded-lg font-medium text-xs md:text-sm transition
                  ${m.key === currentKey ? 'bg-sky-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}"
              >${m.label}</button>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    function extractValue(item, key) {
      if (!item) return null;
      if (item[key] !== undefined && item[key] !== null) return item[key];
      if (item.metrics && item.metrics[key] !== undefined && item.metrics[key] !== null) return item.metrics[key];
      if (item.portfolio) {
        if (item.portfolio[key] && item.portfolio[key].price !== undefined) return item.portfolio[key].price;
        const altKey = key.includes('.') ? key.split('.')[0] : key + '.O';
        if (item.portfolio[altKey] && item.portfolio[altKey].price !== undefined) return item.portfolio[altKey].price;
      }
      return null;
    }

    async function fetchBriefings() {
      const urls = [BRIEFINGS_URL, LEGACY_BRIEFINGS_URL];
      let lastErr = null;
      for (const url of urls) {
        try {
          const res = await fetch(url + '?nocache=' + Date.now());
          if (!res.ok) {
            lastErr = new Error('HTTP ' + res.status + ' (' + url + ')');
            continue;
          }
          const data = await res.json();
          if (url === LEGACY_BRIEFINGS_URL) {
            console.info('구 history.json에서 데이터를 로드했습니다. briefings.json으로 마이그레이션하세요.');
          }
          return data;
        } catch (err) {
          lastErr = err;
        }
      }
      throw lastErr || new Error('브리핑 데이터 로딩 실패');
    }

    function formatKstDateTime(isoOrDate) {
      if (!isoOrDate) return null;
      if (/^\d{4}-\d{2}-\d{2}$/.test(isoOrDate)) {
        return isoOrDate.replace(/-/g, '.') + ' (일자)';
      }
      const d = new Date(isoOrDate);
      if (Number.isNaN(d.getTime())) return String(isoOrDate);
      const parts = new Intl.DateTimeFormat('sv-SE', {
        timeZone: 'Asia/Seoul',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false,
      }).formatToParts(d);
      const get = (t) => (parts.find(p => p.type === t) || {}).value || '';
      return `${get('year')}.${get('month')}.${get('day')} ${get('hour')}:${get('minute')} KST`;
    }

    async function resolveUpdatedAt(latest) {
      if (!latest) return null;
      if (latest.updatedAt) return latest.updatedAt;
      const date = latest.date;
      if (!date || !/^\d{4}-\d{2}-\d{2}$/.test(date)) return date || null;
      const [y, m, d] = date.split('-');
      for (const kind of ['close', 'morning']) {
        try {
          const res = await fetch(`./metadata/market/${y}/${m}/${d}/${kind}.json?t=${Date.now()}`);
          if (!res.ok) continue;
          const meta = await res.json();
          if (meta && meta.generatedAt) return meta.generatedAt;
        } catch (_) { /* ignore */ }
      }
      return date;
    }

    function setLastUpdatedDisplay(isoOrDate) {
      const label = formatKstDateTime(isoOrDate) || '—';
      const liveEl = document.getElementById('liveUpdatedAt');
      const pageEl = document.getElementById('lastUpdatedLabel');
      if (liveEl) liveEl.textContent = label;
      if (pageEl) pageEl.textContent = label;
      const badge = document.getElementById('liveBadge');
      if (badge && isoOrDate) badge.title = `마지막 업데이트: ${label}`;
    }

    async function loadData() {
      try {
        rawData = await fetchBriefings();

        if (Array.isArray(rawData) && rawData.length > 0) {
          selectedItemIndex = rawData.length - 1;
          const latest = rawData[selectedItemIndex];
          setLastUpdatedDisplay(await resolveUpdatedAt(latest));
          renderDashboard(latest);
          // 브리핑 뷰는 들어갈 때 차트 초기화 (첫 페인트 부담 감소)
          if (currentView === 'briefing') {
            displayDetail(latest);
            renderRangeSelector();
            renderChart();
            briefingChartReady = true;
          }
        } else {
          setLastUpdatedDisplay(null);
          renderDashboard(null);
          document.getElementById('selectedReason').innerText = '저장된 데이터가 없습니다.';
        }
      } catch (err) {
        console.error(err);
        setLastUpdatedDisplay(null);
        document.getElementById('dashOverall').innerText = '데이터 로딩 실패: ' + err.message;
        document.getElementById('selectedReason').innerText = '데이터 로딩 실패: ' + err.message;
      }
    }

    function displayDetail(item) {
      if (!item) return;
      document.getElementById('chartTitle').innerText = currentLabel;
      document.getElementById('selectedTitle').innerText = `${currentLabel.split(' ')[0]} 심층 분석`;
      document.getElementById('selectedDate').innerText = item.date || '-';
      document.getElementById('selectedBadge').innerText = `${currentLabel} 전용 사유`;

      let reasonText = '';
      if (item.reasons) {
        if (item.reasons[currentKey]) {
          reasonText = item.reasons[currentKey];
        } else if (currentKey === 'gold_kr' && item.reasons['gold_intl']) {
          reasonText = item.reasons['gold_intl'];
        } else if (currentKey === 'SPCX.O' && item.reasons['SPCX']) {
          reasonText = item.reasons['SPCX'];
        } else if (currentKey === 'SPCX' && item.reasons['SPCX.O']) {
          reasonText = item.reasons['SPCX.O'];
        }
      }
      if (!reasonText && item.reason) reasonText = item.reason;
      if (!reasonText) reasonText = '해당 일자의 분석 데이터가 존재하지 않습니다.';
      document.getElementById('selectedReason').innerText = reasonText;
    }

    function renderChart() {
      const canvas = document.getElementById('macroChart');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const filtered = getFilteredData();
      const labels = filtered.map(d => d.date);
      const values = filtered.map(d => extractValue(d, currentKey));

      const infoEl = document.getElementById('rangeInfo');
      if (infoEl) {
        infoEl.innerText = filtered.length < rawData.length
          ? `최근 ${filtered.length}개 데이터 표시 중 (전체 ${rawData.length}개 중)`
          : `전체 ${rawData.length}개 데이터 표시 중`;
      }

      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: currentLabel,
            data: values,
            borderColor: currentColor,
            backgroundColor: currentColor + '18',
            borderWidth: 3,
            fill: true,
            tension: 0.25,
            pointRadius: filtered.length > 40 ? 2 : 5,
            pointHoverRadius: 8,
            pointBackgroundColor: currentColor,
            pointBorderColor: '#090d16',
            pointBorderWidth: filtered.length > 40 ? 1 : 2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          onClick: (e, elements) => {
            if (elements.length > 0) {
              const idx = elements[0].index;
              const rawIndex = rawData.indexOf(filtered[idx]);
              selectedItemIndex = rawIndex >= 0 ? rawIndex : idx;
              displayDetail(rawData[selectedItemIndex]);
            }
          },
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                afterBody: () => '\n(클릭하면 해당 일자 분석으로 갱신)'
              }
            }
          },
          scales: {
            x: {
              grid: { color: '#1e293b' },
              ticks: { color: '#94a3b8', maxTicksLimit: 10, autoSkip: true }
            },
            y: { grid: { color: '#1e293b' }, ticks: { color: '#94a3b8' } }
          }
        }
      });
    }

    function changeMetric(key, label, color, btnEl) {
      currentKey = key;
      currentLabel = label;
      currentColor = color;

      document.querySelectorAll('#metricNav .btn').forEach(b => {
        b.classList.remove('bg-sky-600', 'text-white');
        b.classList.add('bg-slate-800', 'text-slate-300');
      });
      if (btnEl) {
        btnEl.classList.remove('bg-slate-800', 'text-slate-300');
        btnEl.classList.add('bg-sky-600', 'text-white');
      }

      if (selectedItemIndex >= 0 && rawData[selectedItemIndex]) {
        displayDetail(rawData[selectedItemIndex]);
      }
      renderChart();
    }

    bindNav();
    renderNav();
    const initial = (location.hash || '#dashboard').replace('#', '');
    setView(VIEW_TITLES[initial] ? initial : 'dashboard');
    window.onload = () => { loadData(); loadReports(); };
    window.addEventListener('hashchange', () => {
      const v = location.hash.replace('#', '');
      if (VIEW_TITLES[v]) setView(v);
    });
  </script>
</body>
</html>
