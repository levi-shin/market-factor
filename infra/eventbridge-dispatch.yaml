AWSTemplateFormatVersion: "2010-09-09"

# GitHub Actions 워크플로를 정시에 깨우는 외부 시계.
#
# GitHub의 schedule 이벤트는 best-effort라 8분~168분씩 밀리거나 슬롯이 통째로
# 누락된다. 반면 workflow_dispatch로 띄운 실행은 큐를 타지 않고 즉시 시작한다.
# 그래서 EventBridge 규칙이 cron으로 GitHub REST API를 호출해 워크플로를 깨운다.
#
#   EventBridge Rule (cron, UTC)
#     -> API Destination (POST api.github.com/.../dispatches)
#        -> Connection (Authorization: Bearer <PAT>)
#
# Lambda도 S3도 없다. AWS는 시계 역할만 하고 데이터는 전부 저장소에 남는다.
#
# 저장소의 .github/workflows/*.yml에 있는 cron은 그대로 둔다. 시계가 둘이 되어
# 서로를 백업하며, dispatch가 idempotent해서(아래 참고) 중복 수집이 생기지 않는다.
#
#   - daily는 session=auto로 깨운다. 창 판정과 metadata 완료 검사를 거치므로
#     이미 그날 성공했으면 아무것도 하지 않고 끝난다.
#   - weekly/monthly는 inputs를 비워 force=false 기본값을 쓰고,
#     워크플로가 --skip-if-done으로 이미 만든 리포트를 건너뛴다.
#
# 배포:
#   aws cloudformation deploy \
#     --template-file infra/eventbridge-dispatch.yaml \
#     --stack-name market-factor-scheduler \
#     --region ap-northeast-2 \
#     --capabilities CAPABILITY_IAM \
#     --parameter-overrides GitHubToken=github_pat_xxx

Description: >-
  EventBridge cron -> GitHub workflow_dispatch. Wakes the market briefing
  workflows on time, working around GitHub's best-effort schedule event.

Parameters:
  GitHubOwner:
    Type: String
    Default: levi-shin
    Description: 저장소 소유자

  GitHubRepo:
    Type: String
    Default: market-factor
    Description: 저장소 이름

  GitHubRef:
    Type: String
    Default: main
    Description: 워크플로를 실행할 브랜치

  GitHubToken:
    Type: String
    NoEcho: true
    Description: >-
      fine-grained PAT. 이 저장소에 "Actions: Read and write" 권한만 있으면 된다.
      Bearer 접두사는 템플릿이 붙이므로 토큰 값만 넣는다.

Resources:
  # 인증 정보. EventBridge가 Secrets Manager에 시크릿을 만들어 보관하며,
  # 보관·조회 비용은 API Destination 요금에 포함되어 따로 청구되지 않는다.
  GitHubConnection:
    Type: AWS::Events::Connection
    Properties:
      Name: !Sub "${AWS::StackName}-github"
      Description: GitHub REST API (workflow dispatch)
      AuthorizationType: API_KEY
      AuthParameters:
        # API_KEY 방식은 ApiKeyName을 헤더 이름으로 그대로 쓴다.
        ApiKeyAuthParameters:
          ApiKeyName: Authorization
          ApiKeyValue: !Sub "Bearer ${GitHubToken}"
        InvocationHttpParameters:
          HeaderParameters:
            - Key: Accept
              Value: application/vnd.github+json
              IsValueSecret: false
            - Key: X-GitHub-Api-Version
              Value: "2022-11-28"
              IsValueSecret: false
      # User-Agent는 EventBridge가 Amazon/EventBridge/ApiDestinations로 고정해서
      # 보낸다. 덮어쓸 수 없지만 GitHub의 User-Agent 필수 조건은 이걸로 충족된다.

  # 경로의 *는 규칙마다 PathParameterValues로 채운다.
  # 덕분에 워크플로 4개가 API Destination 하나를 공유한다.
  GitHubDispatchDestination:
    Type: AWS::Events::ApiDestination
    Properties:
      Name: !Sub "${AWS::StackName}-dispatch"
      Description: POST /repos/{owner}/{repo}/actions/workflows/{file}/dispatches
      ConnectionArn: !GetAtt GitHubConnection.Arn
      HttpMethod: POST
      InvocationEndpoint: !Sub "https://api.github.com/repos/${GitHubOwner}/${GitHubRepo}/actions/workflows/*/dispatches"
      InvocationRateLimitPerSecond: 1

  InvokeDestinationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeGitHubDispatch
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: events:InvokeApiDestination
                Resource: !GetAtt GitHubDispatchDestination.Arn

  # ── 아침 브리핑 — KST 월~토 07:30 ────────────────────────────────────────
  # UTC 22~23시대는 KST로 다음 날이라 요일을 하루 앞당겨 적는다(SUN-FRI).
  MorningRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AWS::StackName}-morning"
      Description: KST 월~토 07:30 아침 브리핑
      ScheduleExpression: "cron(30 22 ? * SUN-FRI *)"
      State: ENABLED
      Targets:
        - Id: daily
          Arn: !GetAtt GitHubDispatchDestination.Arn
          RoleArn: !GetAtt InvokeDestinationRole.Arn
          Input: !Sub '{"ref":"${GitHubRef}","inputs":{"session":"auto"}}'
          HttpParameters:
            PathParameterValues:
              - daily.yml
          RetryPolicy:
            MaximumRetryAttempts: 4
            MaximumEventAgeInSeconds: 900

  # 첫 슬롯의 실행이 실패하면(예: Gemini 오류) metadata가 기록되지 않으므로
  # 이 보충 슬롯이 같은 세션을 다시 시도한다. 성공했으면 즉시 종료된다.
  MorningRetryRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AWS::StackName}-morning-retry"
      Description: KST 월~토 08:10 아침 보충
      ScheduleExpression: "cron(10 23 ? * SUN-FRI *)"
      State: ENABLED
      Targets:
        - Id: daily
          Arn: !GetAtt GitHubDispatchDestination.Arn
          RoleArn: !GetAtt InvokeDestinationRole.Arn
          Input: !Sub '{"ref":"${GitHubRef}","inputs":{"session":"auto"}}'
          HttpParameters:
            PathParameterValues:
              - daily.yml
          RetryPolicy:
            MaximumRetryAttempts: 4
            MaximumEventAgeInSeconds: 900

  # ── 장마감 — KST 월~금 16:00 ─────────────────────────────────────────────
  # UTC 07시대는 KST와 같은 날이라 요일을 그대로 쓴다(MON-FRI).
  CloseRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AWS::StackName}-close"
      Description: KST 월~금 16:00 장마감
      ScheduleExpression: "cron(0 7 ? * MON-FRI *)"
      State: ENABLED
      Targets:
        - Id: daily
          Arn: !GetAtt GitHubDispatchDestination.Arn
          RoleArn: !GetAtt InvokeDestinationRole.Arn
          Input: !Sub '{"ref":"${GitHubRef}","inputs":{"session":"auto"}}'
          HttpParameters:
            PathParameterValues:
              - daily.yml
          RetryPolicy:
            MaximumRetryAttempts: 4
            MaximumEventAgeInSeconds: 900

  CloseRetryRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AWS::StackName}-close-retry"
      Description: KST 월~금 16:40 장마감 보충
      ScheduleExpression: "cron(40 7 ? * MON-FRI *)"
      State: ENABLED
      Targets:
        - Id: daily
          Arn: !GetAtt GitHubDispatchDestination.Arn
          RoleArn: !GetAtt InvokeDestinationRole.Arn
          Input: !Sub '{"ref":"${GitHubRef}","inputs":{"session":"auto"}}'
          HttpParameters:
            PathParameterValues:
              - daily.yml
          RetryPolicy:
            MaximumRetryAttempts: 4
            MaximumEventAgeInSeconds: 900

  # ── 주간 리포트 — KST 토 07:35 (UTC 금 22:35) ────────────────────────────
  # 아침 브리핑(07:30)이 먼저 돌도록 5분 뒤에 깨운다.
  WeeklyRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AWS::StackName}-weekly"
      Description: KST 토 07:35 주간 리포트
      ScheduleExpression: "cron(35 22 ? * FRI *)"
      State: ENABLED
      Targets:
        - Id: weekly
          Arn: !GetAtt GitHubDispatchDestination.Arn
          RoleArn: !GetAtt InvokeDestinationRole.Arn
          Input: !Sub '{"ref":"${GitHubRef}"}'
          HttpParameters:
            PathParameterValues:
              - weekly.yml
          RetryPolicy:
            MaximumRetryAttempts: 4
            MaximumEventAgeInSeconds: 900

  WeeklyRetryRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AWS::StackName}-weekly-retry"
      Description: KST 토 08:15 주간 보충
      ScheduleExpression: "cron(15 23 ? * FRI *)"
      State: ENABLED
      Targets:
        - Id: weekly
          Arn: !GetAtt GitHubDispatchDestination.Arn
          RoleArn: !GetAtt InvokeDestinationRole.Arn
          Input: !Sub '{"ref":"${GitHubRef}"}'
          HttpParameters:
            PathParameterValues:
              - weekly.yml
          RetryPolicy:
            MaximumRetryAttempts: 4
            MaximumEventAgeInSeconds: 900

  # ── 월간 리포트 — KST 1일 07:40 ──────────────────────────────────────────
  # cron으로 "KST 1일"을 직접 쓸 수 없다. UTC 기준으로는 전월 마지막 날 22:40이
  # KST 1일 07:40이므로, day-of-month에 L(마지막 날)을 쓴다.
  # 워크플로의 KST 1일 가드도 그대로 통과한다.
  MonthlyRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AWS::StackName}-monthly"
      Description: KST 매달 1일 07:40 월간 리포트
      ScheduleExpression: "cron(40 22 L * ? *)"
      State: ENABLED
      Targets:
        - Id: monthly
          Arn: !GetAtt GitHubDispatchDestination.Arn
          RoleArn: !GetAtt InvokeDestinationRole.Arn
          Input: !Sub '{"ref":"${GitHubRef}"}'
          HttpParameters:
            PathParameterValues:
              - monthly.yml
          RetryPolicy:
            MaximumRetryAttempts: 4
            MaximumEventAgeInSeconds: 900

  MonthlyRetryRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AWS::StackName}-monthly-retry"
      Description: KST 매달 1일 08:20 월간 보충
      ScheduleExpression: "cron(20 23 L * ? *)"
      State: ENABLED
      Targets:
        - Id: monthly
          Arn: !GetAtt GitHubDispatchDestination.Arn
          RoleArn: !GetAtt InvokeDestinationRole.Arn
          Input: !Sub '{"ref":"${GitHubRef}"}'
          HttpParameters:
            PathParameterValues:
              - monthly.yml
          RetryPolicy:
            MaximumRetryAttempts: 4
            MaximumEventAgeInSeconds: 900

Outputs:
  ConnectionArn:
    Description: 토큰을 교체할 때 이 Connection을 수정한다 (Secrets Manager 직접 수정 금지)
    Value: !GetAtt GitHubConnection.Arn

  ApiDestinationArn:
    Value: !GetAtt GitHubDispatchDestination.Arn

  DispatchEndpoint:
    Description: 규칙마다 *를 워크플로 파일명으로 채워 호출한다
    Value: !Sub "https://api.github.com/repos/${GitHubOwner}/${GitHubRepo}/actions/workflows/*/dispatches"
