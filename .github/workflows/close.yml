# 장마감 데이터 갱신 — 월~금 16:00 KST (= 07:00 UTC)
name: Close Update

on:
  schedule:
    # Mon–Fri 07:00 UTC = Mon–Fri 16:00 KST (정시)
    - cron: "0 7 * * 1-5"
    # 보충 슬롯 (이미 성공했으면 --skip-if-done으로 즉시 종료)
    - cron: "0 8 * * 1-5"     # 17:00 KST
    - cron: "0 9 * * 1-5"     # 18:00 KST
  workflow_dispatch:

concurrency:
  group: market-briefing-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run close update (no Slack)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
        run: |
          # 수동 실행은 항상 강제 재실행, 스케줄만 중복 방지
          SKIP=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            SKIP="--skip-if-done"
          fi
          python lambda_function.py --mode daily --send-notification false $SKIP

      - name: Commit updated data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in briefings.json history.json raw analysis evidence metadata reports; do
            if [ -e "$p" ]; then
              git add "$p"
            fi
          done
          if git diff --staged --quiet; then
            echo "No data changes to commit"
            exit 0
          fi
          git commit -m "chore: update close briefing data"
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true
          git push
