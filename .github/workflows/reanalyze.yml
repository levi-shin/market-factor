# 오늘 briefings 레코드의 AI reasons만 재생성 (시세 수집 없음)
name: Reanalyze Today

on:
  workflow_dispatch:

concurrency:
  group: market-briefing-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Reanalyze today's AI reasons
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
        run: python lambda_function.py --mode reanalyze

      - name: Commit updated analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add briefings.json history.json analysis metadata raw evidence || true
          if git diff --staged --quiet; then
            echo "No data changes to commit"
            exit 0
          fi
          git commit -m "chore: reanalyze today's AI reasons"
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true
          git push
