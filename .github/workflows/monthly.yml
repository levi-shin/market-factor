# 월간 리포트 — 매달 1일 07:30 KST
# GitHub cron은 KST 타임존이 없어서, 전월 말(UTC 28–31일 22:30)에 돌리고
# KST 기준 1일일 때만 실행한다.
name: Monthly Report

on:
  schedule:
    # KST 1일 오전 창(07:30~11:00) 안에서 여러 번 시도.
    # 아래 UTC 슬롯 중 KST 기준 1일인 것만 가드를 통과한다.
    - cron: "30 22 28-31 * *"   # KST 익일 07:30
    - cron: "0 23 28-31 * *"    # KST 익일 08:00
    - cron: "0 0,1,2 1 * *"     # KST 1일 09:00~11:00
  workflow_dispatch:
    inputs:
      force:
        description: "이미 생성된 달도 다시 만들기"
        required: false
        default: false
        type: boolean

concurrency:
  group: market-briefing-monthly
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Guard — only run on KST day 1 (or manual)
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DAY="$(TZ=Asia/Seoul date +%d)"
          echo "KST day=$DAY"
          if [ "$DAY" = "01" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not the 1st in KST — skip"
          fi

      - uses: actions/checkout@v5
        if: steps.guard.outputs.run == 'true'

      - uses: actions/setup-python@v6
        if: steps.guard.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Run monthly report
        if: steps.guard.outputs.run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
        run: |
          SKIP="--skip-if-done"
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            SKIP=""
          fi
          python lambda_function.py --mode monthly $SKIP

      - name: Commit updated report
        if: always() && steps.guard.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in briefings.json history.json raw analysis evidence metadata reports; do
            if [ -e "$p" ]; then
              git add "$p"
            fi
          done
          if git diff --staged --quiet; then
            echo "No data changes to commit"
            exit 0
          fi
          git commit -m "chore: update monthly market report"
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true
          git push
