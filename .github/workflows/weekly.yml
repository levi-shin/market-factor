# 주간 리포트 — 토요일 07:30 KST (= 금요일 22:30 UTC)
name: Weekly Report

on:
  schedule:
    # Fri 22:30 UTC = Sat 07:30 KST
    - cron: "30 22 * * 5"
  workflow_dispatch:

concurrency:
  group: market-briefing-weekly
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run weekly report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
        run: python lambda_function.py --mode weekly

      - name: Commit updated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add briefings.json reports raw analysis evidence metadata || true
          if git diff --staged --quiet; then
            echo "No data changes to commit"
            exit 0
          fi
          git commit -m "chore: update weekly market report"
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true
          git push
