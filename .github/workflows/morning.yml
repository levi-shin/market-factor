# 아침 브리핑 — 월~토 07:30 KST (= 22:30 UTC 전날)
name: Morning Briefing

on:
  schedule:
    # Sun–Fri 22:30 UTC = Mon–Sat 07:30 KST
    - cron: "30 22 * * 0-5"
  workflow_dispatch:
    inputs:
      send_notification:
        description: "Slack 알림 발송 여부"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  group: market-briefing-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run morning briefing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
        run: |
          NOTIFY="${{ github.event.inputs.send_notification || 'true' }}"
          python lambda_function.py --mode daily --send-notification "$NOTIFY"

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add briefings.json history.json raw analysis evidence metadata reports || true
          if git diff --staged --quiet; then
            echo "No data changes to commit"
            exit 0
          fi
          git commit -m "chore: update morning briefing data"
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true
          git push
