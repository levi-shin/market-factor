# 일간 브리핑 디스패처
#
# GitHub의 schedule은 실행이 보장되지 않아 특정 슬롯이 통째로 누락된다.
# (2026-09-04 관측: 아침이 5시간 지연, 장마감 3개 슬롯 전부 미발생)
#
# 그래서 정시 하나에 의존하지 않고, 창(window) 안에서 30분 간격으로 시도한다.
# --mode auto가 KST 시각으로 세션을 판별하고, 그날 이미 성공했으면 즉시 종료하므로
# 실제 수집/AI 호출은 세션당 1회만 일어난다.
#
#   아침   07:30~12:00 KST (월~토) = 22:30~03:00 UTC
#   장마감 16:00~22:00 KST (월~금) = 07:00~13:00 UTC
#
# 슬롯 분(minute)은 :00/:30을 피해 흩어 놓는다. 매시 정각은 전 세계 워크플로가
# 몰리는 시간대라 GitHub가 실행을 밀거나 통째로 흘린다.
# (2026-09-05~07 관측: 정시 크론이 8분~168분 지연, 절반 이상 슬롯 미발생)
#
# UTC 22~23시대 슬롯은 KST로 다음 날이므로 요일 필드를 하루 앞당겨 적는다.
name: Daily Briefing

on:
  schedule:
    # 아침 — KST 월~토 07:33 ~ 11:33
    - cron: "33,57 22 * * 0-5"   # KST 07:33, 07:57
    - cron: "21,49 23 * * 0-5"   # KST 08:21, 08:49
    - cron: "13,41 0 * * 1-6"    # KST 09:13, 09:41
    - cron: "9,37 1 * * 1-6"     # KST 10:09, 10:37
    - cron: "7,33 2 * * 1-6"     # KST 11:07, 11:33
    # 장마감 — KST 월~금 16:04 ~ 21:44
    - cron: "4,32 7 * * 1-5"     # KST 16:04, 16:32
    - cron: "6,34 8 * * 1-5"     # KST 17:06, 17:34
    - cron: "8,36 9 * * 1-5"     # KST 18:08, 18:36
    - cron: "12,38 10 * * 1-5"   # KST 19:12, 19:38
    - cron: "14,42 11 * * 1-5"   # KST 20:14, 20:42
    - cron: "16,44 12 * * 1-5"   # KST 21:16, 21:44
  workflow_dispatch:
    inputs:
      session:
        description: "실행할 세션 (auto=시각으로 판별)"
        required: true
        default: "auto"
        type: choice
        options:
          - "auto"
          - "morning"
          - "close"
      force:
        description: "이미 published여도 강제 재실행 (잘못된 시세 고칠 때)"
        required: false
        default: false
        type: boolean

concurrency:
  group: market-briefing-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run briefing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
        run: |
          SESSION="${{ github.event.inputs.session || 'auto' }}"
          FORCE="${{ github.event.inputs.force || 'false' }}"
          # force면 오늘 morning/close published 마커를 지워 auto/skip 가드를 통과시킨다.
          if [ "$FORCE" = "true" ]; then
            TODAY_KST=$(TZ=Asia/Seoul date +%Y/%m/%d)
            for kind in morning close; do
              META="metadata/market/${TODAY_KST}/${kind}.json"
              if [ -f "$META" ]; then
                python -c "import json,pathlib; p=pathlib.Path('$META'); m=json.loads(p.read_text(encoding='utf-8')); m['status']='forced-rerun'; m['note']='workflow_dispatch force=true'; p.write_text(json.dumps(m, ensure_ascii=False, indent=2)+'\n', encoding='utf-8'); print('cleared', p)"
              fi
            done
          fi
          case "$SESSION" in
            morning) python lambda_function.py --mode daily --send-notification true ;;
            close)   python lambda_function.py --mode daily --send-notification false ;;
            *)       python lambda_function.py --mode auto ;;
          esac

      - name: Commit updated data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in briefings.json history.json reports.json raw analysis evidence metadata reports; do
            if [ -e "$p" ]; then
              git add "$p"
            fi
          done
          if git diff --staged --quiet; then
            echo "No data changes to commit"
            exit 0
          fi
          git commit -m "chore: update daily briefing data"
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true
          git push
